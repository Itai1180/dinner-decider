<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>注册</title>
</head>

<body>
    <h2>注册</h2>
    <input id="username" placeholder="用户名(1~50)">
    <input id="nickname" placeholder="昵称(1~30)">
    <input id="password" type="password" placeholder="密码(6~128)">
    <button onclick="doRegister()">注册</button>
    <p><a href="/login.html">已有账号？去登录</a></p>

    <script src="/js/api.js"></script>
    <script>
        async function doRegister() {
            const result = await apiPost('/api/register/', {
                username: username.value,
                nickname: nickname.value,
                password: password.value
            });
            if (result.code === 200) {
                alert('注册成功');
                location.href = '/login.html';
                return;
            }
            alert(result.msg);
        }
    </script>
</body>

</html>
